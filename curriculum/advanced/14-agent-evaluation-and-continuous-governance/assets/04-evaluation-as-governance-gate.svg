<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Evaluation as an Executable Governance Gate</text><text x="65" y="245" font-size="22" fill="#60758A">Translate evaluation evidence into release, runtime and remediation decisions.</text>
<rect x="70" y="350" width="270" height="190" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="205" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#1769C2">CHANGE</text><text x="205" y="460" text-anchor="middle" font-size="16" fill="#60758A">model • prompt • tool</text><text x="205" y="492" text-anchor="middle" font-size="16" fill="#60758A">policy • knowledge</text>
<line x1="340" y1="445" x2="445" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="460" y="300" width="430" height="290" rx="25" fill="#082542"/><text x="675" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#B9571D">EVALUATION GATE</text><text x="675" y="410" text-anchor="middle" font-size="16" fill="#FFFFFF">quality + task success</text><text x="675" y="448" text-anchor="middle" font-size="16" fill="#FFFFFF">trajectory + tool correctness</text><text x="675" y="486" text-anchor="middle" font-size="16" fill="#FFFFFF">security + policy compliance</text><text x="675" y="524" text-anchor="middle" font-size="16" fill="#FFFFFF">risk-tier thresholds</text>
<line x1="890" y1="445" x2="990" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="1005" y="315" width="525" height="260" rx="24" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1267" y="375" text-anchor="middle" font-size="21" font-weight="700" fill="#2F855A">GOVERNANCE DECISION</text><text x="1267" y="430" text-anchor="middle" font-size="18" fill="#60758A">PASS → deploy</text><text x="1267" y="468" text-anchor="middle" font-size="18" fill="#60758A">CONDITIONAL → constrain / review</text><text x="1267" y="506" text-anchor="middle" font-size="18" fill="#60758A">FAIL → block release</text>
<text x="800" y="750" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Evaluation becomes governance when results are tied to explicit decisions and actions.</text></g></svg>