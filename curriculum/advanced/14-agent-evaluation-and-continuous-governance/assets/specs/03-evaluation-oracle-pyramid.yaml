version: 1
id: course14-evaluation-oracle-pyramid
title: "The Evaluation Oracle Pyramid"
purpose: "Prioritize deterministic facts and reference evidence before calibrated judgment."
output:
  svg: ../03-evaluation-oracle-pyramid.svg
  medium: course-documentation
  alt_text: "A pyramid with deterministic assertions and system facts at the base, model judges in the middle, and human review at the top."
canvas: { width: 1600, height: 900, background: "#F7F9FC", margin: 65, grid: 5 }
layout: { primary_flow: bottom-to-top, min_node_gap: 0, min_layer_gap: 0, node_padding: { x: 24, y: 16 } }
style:
  font_family: "Arial, Helvetica, sans-serif"
  title_color: "#082542"
  semantic_colors:
    deterministic: { fill: "#FFFFFF", stroke: "#2F855A" }
    judge: { fill: "#FFFFFF", stroke: "#1769C2" }
    human: { fill: "#FFFFFF", stroke: "#805AD5" }
nodes:
  - { id: deterministic, label: "DETERMINISTIC ASSERTIONS + SYSTEM FACTS", type: deterministic, bounds: { x: 440, y: 610, width: 720, height: 80 } }
  - { id: judge, label: "MODEL / LLM JUDGES", type: judge, bounds: { x: 590, y: 530, width: 420, height: 80 } }
  - { id: human, label: "HUMAN REVIEW", type: human, bounds: { x: 700, y: 305, width: 200, height: 225 } }
edges: []
validation: { no_overlaps: true, route_around_nodes: true, min_text_padding: 16, min_connector_clearance: 12, verify_port_attachment: true, verify_contrast: true }
