version: 1
id: course14-agent-evaluation-stack
title: "The Agent Evaluation Stack"
purpose: "Show that agent evaluation must cover outcome, trajectory, tools, policy, and safety together."
output:
  svg: ../01-agent-evaluation-stack.svg
  medium: course-documentation
  alt_text: "Five nested horizontal layers descend from outcome to trajectory, tools, policy, and safety."
canvas: { width: 1600, height: 900, background: "#F7F9FC", margin: 65, grid: 5 }
layout: { primary_flow: top-to-bottom, min_node_gap: 23, min_layer_gap: 23, node_padding: { x: 30, y: 20 } }
style:
  font_family: "Arial, Helvetica, sans-serif"
  title_color: "#082542"
  semantic_colors:
    outcome: { fill: "#FFFFFF", stroke: "#1769C2" }
    trajectory: { fill: "#FFFFFF", stroke: "#805AD5" }
    tools: { fill: "#FFFFFF", stroke: "#129B96" }
    policy: { fill: "#FFFFFF", stroke: "#B9571D" }
    safety: { fill: "#FFFFFF", stroke: "#C53030" }
nodes:
  - { id: outcome, label: "OUTCOME — Did the task succeed?", type: outcome, bounds: { x: 260, y: 310, width: 1080, height: 82 } }
  - { id: trajectory, label: "TRAJECTORY — Was the path sound?", type: trajectory, bounds: { x: 330, y: 415, width: 940, height: 82 } }
  - { id: tools, label: "TOOLS — Were actions correct?", type: tools, bounds: { x: 400, y: 520, width: 800, height: 82 } }
  - { id: policy, label: "POLICY — Were controls obeyed?", type: policy, bounds: { x: 470, y: 625, width: 660, height: 82 } }
  - { id: safety, label: "SAFETY — Was harm prevented?", type: safety, bounds: { x: 540, y: 730, width: 520, height: 82 } }
edges: []
validation: { no_overlaps: true, route_around_nodes: true, min_text_padding: 16, min_connector_clearance: 12, verify_port_attachment: true, verify_contrast: true }
