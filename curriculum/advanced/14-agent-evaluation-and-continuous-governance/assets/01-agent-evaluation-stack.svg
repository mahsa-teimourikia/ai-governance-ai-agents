<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">The Agent Evaluation Stack</text><text x="65" y="245" font-size="22" fill="#60758A">Evaluate outcome, trajectory, tools, policy compliance and safety together.</text><rect x="260" y="310" width="1080" height="82" rx="18" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="290" y="344" font-size="18" font-weight="700" fill="#1769C2">OUTCOME</text><text x="510" y="344" font-size="16" fill="#60758A">Did the task succeed?</text><rect x="330" y="415" width="940" height="82" rx="18" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="360" y="449" font-size="18" font-weight="700" fill="#805AD5">TRAJECTORY</text><text x="580" y="449" font-size="16" fill="#60758A">Was the path sound?</text><rect x="400" y="520" width="800" height="82" rx="18" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="430" y="554" font-size="18" font-weight="700" fill="#129B96">TOOLS</text><text x="650" y="554" font-size="16" fill="#60758A">Were actions correct?</text><rect x="470" y="625" width="660" height="82" rx="18" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="500" y="659" font-size="18" font-weight="700" fill="#B9571D">POLICY</text><text x="720" y="659" font-size="16" fill="#60758A">Were controls obeyed?</text><rect x="540" y="730" width="520" height="82" rx="18" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="570" y="764" font-size="18" font-weight="700" fill="#C53030">SAFETY</text><text x="790" y="764" font-size="16" fill="#60758A">Was harm prevented?</text><text x="800" y="840" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Agent evaluation is multi-dimensional: a correct answer can still come from an unsafe trajectory.</text></g></svg>