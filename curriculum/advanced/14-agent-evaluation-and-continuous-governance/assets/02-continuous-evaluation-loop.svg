<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Continuous Evaluation &amp; Governance Loop</text><text x="65" y="245" font-size="22" fill="#60758A">Governance is a release-and-runtime feedback system, not a one-time approval.</text><circle cx="150" cy="450" r="88" fill="#FFFFFF" stroke="#1769C2" stroke-width="4"/><text x="150" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#1769C2">DESIGN</text><line x1="238" y1="450" x2="287" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="405" cy="450" r="88" fill="#FFFFFF" stroke="#805AD5" stroke-width="4"/><text x="405" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#805AD5">OFFLINE EVAL</text><line x1="493" y1="450" x2="542" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="660" cy="450" r="88" fill="#FFFFFF" stroke="#B9571D" stroke-width="4"/><text x="660" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#B9571D">RELEASE GATE</text><line x1="748" y1="450" x2="797" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="915" cy="450" r="88" fill="#FFFFFF" stroke="#2F855A" stroke-width="4"/><text x="915" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#2F855A">DEPLOY</text><line x1="1003" y1="450" x2="1052" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="1170" cy="450" r="88" fill="#FFFFFF" stroke="#129B96" stroke-width="4"/><text x="1170" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#129B96">ONLINE MONITOR</text><line x1="1258" y1="450" x2="1307" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="1425" cy="450" r="88" fill="#FFFFFF" stroke="#C53030" stroke-width="4"/><text x="1425" y="458" text-anchor="middle" font-size="17" font-weight="700" fill="#C53030">LEARN + UPDATE</text><path d="M1425 565 C1425 715,165 715,165 565" fill="none" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><text x="800" y="770" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Production evidence becomes new evaluation data; evaluation results become new controls.</text></g></svg>