version: 1
id: course17-authority-and-approval
title: "Authority Attenuation and Approval Binding"
purpose: "Show capability intersection across delegation and exact approval before gateway execution."
output:
  svg: ../02-authority-and-approval.svg
  medium: documentation
  alt_text: "Human authority attenuates through a manager to a read-only research agent, while a high-value purchase order passes through exact approval before the gateway."
canvas: { width: 1200, height: 620, background: "#F7F9FC", margin: 60, grid: 5 }
layout: { primary_flow: left-to-right, min_node_gap: 90, min_layer_gap: 100, node_padding: { x: 20, y: 14 } }
style:
  font_family: "Arial, sans-serif"
  title_color: "#16324F"
  semantic_colors:
    principal: { fill: "#FFFFFF", stroke: "#D7DEE8" }
    agent: { fill: "#EAF0FF", stroke: "#2F6BFF" }
    delegation: { fill: "#F0EDFF", stroke: "#7667E8" }
    action: { fill: "#FFF1E3", stroke: "#F59E42" }
groups: []
nodes:
  - { id: human, label: "Human", subtitle: "vendor.read • po.prepare • po.create", type: principal, bounds: { x: 70, y: 150, width: 230, height: 150 }, ports: { out: { side: right, offset: 0.5 } } }
  - { id: manager, label: "Manager agent", subtitle: "same tenant • delegates subset • cannot amplify", type: agent, bounds: { x: 390, y: 150, width: 250, height: 150 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: researcher, label: "Research agent", subtitle: "vendor.read only • no PO creation", type: delegation, bounds: { x: 730, y: 150, width: 250, height: 150 }, ports: { in: { side: left, offset: 0.5 } } }
  - { id: high_value_action, label: "High-value action", subtitle: "po.create • CAD 12,000 • V42", type: action, bounds: { x: 150, y: 400, width: 330, height: 110 }, ports: { out: { side: right, offset: 0.5 } } }
  - { id: exact_approval, label: "Exact approval", subtitle: "hash + approver + expiry", type: delegation, bounds: { x: 570, y: 400, width: 260, height: 110 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: gateway, label: "Gateway", subtitle: "ALLOW / DENY", type: agent, bounds: { x: 920, y: 400, width: 190, height: 110 }, ports: { in: { side: left, offset: 0.5 } } }
edges:
  - { id: human_to_manager, from: { node: human, port: out }, to: { node: manager, port: in }, route: [[300, 225], [390, 225]] }
  - { id: manager_to_researcher, from: { node: manager, port: out }, to: { node: researcher, port: in }, route: [[640, 225], [730, 225]] }
  - { id: action_to_approval, from: { node: high_value_action, port: out }, to: { node: exact_approval, port: in }, route: [[480, 455], [570, 455]] }
  - { id: approval_to_gateway, from: { node: exact_approval, port: out }, to: { node: gateway, port: in }, route: [[830, 455], [920, 455]] }
validation: { no_overlaps: true, route_around_nodes: true, min_text_padding: 14, min_connector_clearance: 10, verify_port_attachment: true, verify_contrast: true }
source: { renderer: "deterministic hand-authored SVG", note: "Coordinates, labels, colors and routes are authoritative." }
