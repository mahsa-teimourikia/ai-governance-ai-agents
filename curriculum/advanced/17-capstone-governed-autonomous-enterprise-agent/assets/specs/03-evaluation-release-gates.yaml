version: 1
id: course17-evaluation-release-gates
title: "Continuous Evaluation and Release Gates"
purpose: "Show how multi-dimensional evaluation evidence drives bounded deployment or remediation."
output:
  svg: ../03-evaluation-release-gates.svg
  medium: documentation
  alt_text: "A candidate agent passes through an evaluation matrix and governance gate to bounded deployment or block and remediation, with production drift feeding regression evaluation."
canvas: { width: 1200, height: 560, background: "#F7F9FC", margin: 60, grid: 5 }
layout: { primary_flow: left-to-right, min_node_gap: 70, min_layer_gap: 85, node_padding: { x: 20, y: 14 } }
style:
  font_family: "Arial, sans-serif"
  title_color: "#16324F"
  semantic_colors:
    candidate: { fill: "#FFFFFF", stroke: "#D7DEE8" }
    evaluation: { fill: "#EAF0FF", stroke: "#2F6BFF" }
    governance: { fill: "#F0EDFF", stroke: "#7667E8" }
    deploy: { fill: "#E7F8F7", stroke: "#16A3A5" }
    block: { fill: "#FFF1E3", stroke: "#F59E42" }
groups: []
nodes:
  - { id: candidate, label: "Candidate", subtitle: "agent + policy + tools", type: candidate, bounds: { x: 60, y: 170, width: 190, height: 110 }, ports: { out: { side: right, offset: 0.5 } } }
  - { id: evaluation_matrix, label: "Evaluation matrix", subtitle: "outcome • trajectory • authorization • security • evidence", type: evaluation, bounds: { x: 320, y: 115, width: 250, height: 220 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: governance_gate, label: "Governance gate", subtitle: "risk slices • confidence • materiality • residual risk", type: governance, bounds: { x: 640, y: 115, width: 220, height: 220 }, ports: { in: { side: left, offset: 0.5 }, deploy: { side: right, offset: 0.3 }, block: { side: right, offset: 0.7 } } }
  - { id: deploy, label: "Deploy", subtitle: "bounded canary", type: deploy, bounds: { x: 930, y: 115, width: 190, height: 90 }, ports: { in: { side: left, offset: 0.72 } } }
  - { id: block, label: "Block / constrain", subtitle: "remediate + retest", type: block, bounds: { x: 930, y: 245, width: 190, height: 90 }, ports: { in: { side: left, offset: 0.28 } } }
  - { id: feedback, label: "Production drift → near miss → regression case → re-evaluate", type: candidate, bounds: { x: 320, y: 420, width: 540, height: 70 } }
edges:
  - { id: candidate_to_evaluation, from: { node: candidate, port: out }, to: { node: evaluation_matrix, port: in }, route: [[250, 225], [320, 225]] }
  - { id: evaluation_to_gate, from: { node: evaluation_matrix, port: out }, to: { node: governance_gate, port: in }, route: [[570, 225], [640, 225]] }
  - { id: gate_to_deploy, from: { node: governance_gate, port: deploy }, to: { node: deploy, port: in }, route: [[860, 180], [930, 180]] }
  - { id: gate_to_block, from: { node: governance_gate, port: block }, to: { node: block, port: in }, route: [[860, 270], [930, 270]] }
validation: { no_overlaps: true, route_around_nodes: true, min_text_padding: 14, min_connector_clearance: 10, verify_port_attachment: true, verify_contrast: true }
source: { renderer: "deterministic hand-authored SVG", note: "Coordinates, labels, colors and routes are authoritative." }
