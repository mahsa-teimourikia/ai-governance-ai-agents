  - { id: incident_to_audit, from: { node: incident, port: out }, to: { node: audit, port: in }, route: [[520, 420], [630, 420]] }
  - { id: audit_to_improve, from: { node: audit, port: out }, to: { node: improve, port: in }, route: [[800, 420], [910, 420]] }
