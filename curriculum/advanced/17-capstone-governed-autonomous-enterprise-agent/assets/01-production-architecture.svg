<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Governed autonomous enterprise agent production architecture</title><desc id="d">A procurement agent proposes actions through a governance control plane, tool gateway, business systems, and evidence feedback loop.</desc><rect width="1200" height="700" fill="#F7F9FC"/><style>text{font-family:Arial,sans-serif;fill:#16324F; text-anchor:middle} .l{text-anchor:start} .h{font-weight:700; font-size:18px} .s{font-size:15px; fill:#52606D} .b{stroke:#D7DEE8;stroke-width:2} .a{fill:#fff} .svc{fill:#EAF0FF;stroke:#2F6BFF} .gov{fill:#F0EDFF;stroke:#7667E8} .dat{fill:#E7F8F7;stroke:#16A3A5} .tool{fill:#FFF1E3;stroke:#F59E42} .ops{fill:#EDF0F2;stroke:#52606D} .line{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#m)} </style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#52606D"/></marker></defs><text x="60" y="55" font-size="30" class="h l">Governed Autonomous Enterprise Agent</text><text x="60" y="82" class="s l">The agent proposes; the control plane authorizes; evidence proves the consequence.</text><text x="60" y="655" class="s l">One+i • identity • authority • policy • action • evidence • continuous evaluation</text><rect x="60" y="125" width="220" height="110" rx="14" class="a b"/><text x="170.0" y="175.0" class="h">Employee / goal</text><text x="170.0" y="200.0" class="s">identity + tenant scope</text><rect x="340" y="125" width="250" height="110" rx="14" class="svc"/><text x="465.0" y="175.0" class="h">Procurement agent</text><text x="465.0" y="200.0" class="s">plan · retrieve · propose</text><rect x="340" y="280" width="250" height="110" rx="14" class="dat b"/><text x="465.0" y="330.0" class="h">Governed context</text><text x="465.0" y="355.0" class="s">RAG + memory provenance</text><rect x="340" y="435" width="250" height="110" rx="14" class="dat b"/><text x="465.0" y="485.0" class="h">Evidence store</text><text x="465.0" y="510.0" class="s">traces · approvals · outcomes</text><rect x="650" y="105" width="430" height="290" rx="18" fill="#F4F1FF" stroke="#7667E8" stroke-width="3"/><text x="865" y="140" class="h" style="font-size:20px; fill:#7667E8">GOVERNANCE CONTROL PLANE</text><rect x="680" y="160" width="170" height="70" rx="10" class="gov b"/><text x="765.0" y="201.0" class="h">Policy + AuthZ</text><rect x="880" y="160" width="170" height="70" rx="10" class="gov b"/><text x="965.0" y="201.0" class="h">Risk + approval</text><rect x="680" y="290" width="170" height="70" rx="10" class="gov b"/><text x="765.0" y="331.0" class="h">Guardrails</text><rect x="880" y="290" width="170" height="70" rx="10" class="gov b"/><text x="965.0" y="331.0" class="h">Budgets + halt</text><rect x="650" y="435" width="250" height="110" rx="14" class="tool b"/><text x="775.0" y="485.0" class="h">Tool / MCP gateway</text><text x="775.0" y="510.0" class="s">schema + egress + idempotency</text><rect x="970" y="435" width="170" height="110" rx="14" class="ops b"/><text x="1055.0" y="485.0" class="h">Business APIs</text><text x="1055.0" y="510.0" class="s">PO · vendor · ERP</text><path d="M 280 180 H 340" class="line"/><path d="M 590 160 H 650" class="line"/><path d="M 650 210 H 590" class="line"/><path d="M 465 235 V 280" class="line"/><path d="M 590 335 H 620 V 490 H 650" class="line"/><path d="M 775 435 V 395" class="line"/><path d="M 1055 435 V 395" class="line"/><path d="M 900 490 H 970" class="line"/><path d="M 650 490 H 590" class="line"/></svg>