<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Governed autonomous enterprise agent production architecture</title><desc id="d">A procurement agent proposes actions through a governance control plane, tool gateway, business systems, and evidence feedback loop.</desc><rect width="1200" height="700" fill="#F7F9FC"/><style>text{font-family:Arial,sans-serif;fill:#16324F} .h{font-weight:700}.s{font-size:16px}.b{stroke:#D7DEE8;stroke-width:2}.a{fill:#fff}.svc{fill:#EAF0FF;stroke:#2F6BFF}.gov{fill:#F0EDFF;stroke:#7667E8}.dat{fill:#E7F8F7;stroke:#16A3A5}.tool{fill:#FFF1E3;stroke:#F59E42}.ops{fill:#EDF0F2;stroke:#52606D}.line{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#52606D"/></marker></defs><text x="60" y="55" font-size="30" class="h">Governed Autonomous Enterprise Agent</text><text x="60" y="82" class="s">The agent proposes; the control plane authorizes; evidence proves the consequence.</text><rect x="60" y="125" width="220" height="110" rx="14" class="a b"/><text x="85" y="165" class="h">Employee / goal</text><text x="85" y="195" class="s">identity + tenant scope</text><rect x="340" y="125" width="250" height="110" rx="14" class="svc"/><text x="375" y="165" class="h">Procurement agent</text><text x="375" y="195" class="s">plan · retrieve · propose</text><rect x="650" y="105" width="430" height="270" rx="18" fill="#F4F1FF" stroke="#7667E8" stroke-width="3"/><text x="680" y="145" class="h" font-size="20">GOVERNANCE CONTROL PLANE</text><rect x="680" y="170" width="170" height="70" rx="10" class="gov b"/><text x="705" y="212" class="h">Policy + AuthZ</text><rect x="880" y="170" width="170" height="70" rx="10" class="gov b"/><text x="900" y="212" class="h">Risk + approval</text><rect x="680" y="265" width="170" height="70" rx="10" class="gov b"/><text x="698" y="307" class="h">Guardrails</text><rect x="880" y="265" width="170" height="70" rx="10" class="gov b"/><text x="900" y="307" class="h">Budgets + halt</text><rect x="340" y="300" width="250" height="110" rx="14" class="dat b"/><text x="390" y="340" class="h">Governed context</text><text x="380" y="370" class="s">RAG + memory provenance</text><rect x="650" y="445" width="250" height="105" rx="14" class="tool b"/><text x="700" y="485" class="h">Tool / MCP gateway</text><text x="690" y="515" class="s">schema + egress + idempotency</text><rect x="970" y="445" width="170" height="105" rx="14" class="ops b"/><text x="992" y="485" class="h">Business APIs</text><text x="990" y="515" class="s">PO · vendor · ERP</text><rect x="340" y="500" width="250" height="105" rx="14" class="dat b"/><text x="395" y="540" class="h">Evidence store</text><text x="375" y="570" class="s">traces · approvals · outcomes</text><path d="M280 180H340M590 180H650M465 235V300M590 355H650V445M900 497H970M650 497H590V552" class="line"/><path d="M775 445V375M1000 445V375M775 375H590V235" class="line"/><text x="60" y="655" class="s">One+i • identity • authority • policy • action • evidence • continuous evaluation</text></svg>
