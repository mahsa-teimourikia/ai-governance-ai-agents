<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Authority attenuation and approval binding</title><desc id="d">Human authority is attenuated through manager and researcher identities; high-value actions require an exact, unexpired approval.</desc><rect width="1200" height="620" fill="#F7F9FC"/><style>text{font-family:Arial,sans-serif;fill:#16324F}.h{font-weight:700}.s{font-size:16px}.c{fill:#fff;stroke:#D7DEE8;stroke-width:2}.p{fill:#EAF0FF;stroke:#2F6BFF;stroke-width:2}.g{fill:#F0EDFF;stroke:#7667E8;stroke-width:2}.x{fill:#FFF1E3;stroke:#F59E42;stroke-width:2}.l{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#52606D"/></marker></defs><text x="60" y="55" font-size="30" class="h">Authority is attenuated, approvals bind to exact actions</text><text x="60" y="82" class="s">Effective authority = parent ∩ delegation grant ∩ role ∩ task policy ∩ runtime policy</text><rect x="70" y="150" width="230" height="150" rx="14" class="c"/><text x="105" y="190" class="h">Human</text><text x="105" y="225" class="s">vendor.read</text><text x="105" y="250" class="s">po.prepare</text><text x="105" y="275" class="s">po.create</text><rect x="390" y="150" width="250" height="150" rx="14" class="p"/><text x="435" y="190" class="h">Manager agent</text><text x="435" y="225" class="s">same tenant</text><text x="435" y="250" class="s">delegates subset</text><text x="435" y="275" class="s">cannot amplify</text><rect x="730" y="150" width="250" height="150" rx="14" class="g"/><text x="775" y="190" class="h">Research agent</text><text x="775" y="225" class="s">vendor.read only</text><text x="775" y="250" class="s">no PO creation</text><text x="775" y="275" class="s">task-scoped context</text><path d="M300 225H390M640 225H730" class="l"/><rect x="150" y="400" width="330" height="110" rx="14" class="x"/><text x="190" y="440" class="h">High-value action</text><text x="190" y="470" class="s">po.create · $12,000 · V42</text><rect x="570" y="400" width="260" height="110" rx="14" class="g"/><text x="615" y="440" class="h">Exact approval</text><text x="610" y="470" class="s">hash + approver + expiry</text><rect x="920" y="400" width="190" height="110" rx="14" class="p"/><text x="955" y="440" class="h">Gateway</text><text x="950" y="470" class="s">ALLOW / DENY</text><path d="M480 455H570M830 455H920" class="l"/><text x="60" y="575" class="s">Mutation, replay, expiry, cross-tenant use, or policy outage must fail closed.</text></svg>
