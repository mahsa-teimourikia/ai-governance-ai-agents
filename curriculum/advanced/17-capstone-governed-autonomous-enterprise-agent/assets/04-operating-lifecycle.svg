<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Governed agent operating lifecycle</title><desc id="d">The agent lifecycle moves from registration and risk assessment through approval, deployment, monitoring, change management, recertification, and incident response.</desc><rect width="1200" height="520" fill="#F7F9FC"/><style>text{font-family:Arial,sans-serif;fill:#16324F}.h{font-weight:700}.s{font-size:15px}.n{fill:#fff;stroke:#D7DEE8;stroke-width:2}.g{fill:#F0EDFF;stroke:#7667E8;stroke-width:2}.t{fill:#E7F8F7;stroke:#16A3A5;stroke-width:2}.o{fill:#FFF1E3;stroke:#F59E42;stroke-width:2}.l{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#52606D"/></marker></defs><text x="60" y="55" font-size="30" class="h">Operating model: approval is a lifecycle state</text><text x="60" y="82" class="s">Every material change reopens the assumptions behind trust.</text><rect x="70" y="190" width="150" height="85" rx="12" class="n"/><text x="105" y="225" class="h">Register</text><text x="100" y="250" class="s">agent card</text><rect x="270" y="190" width="150" height="85" rx="12" class="g"/><text x="305" y="225" class="h">Assess</text><text x="295" y="250" class="s">risk + supply chain</text><rect x="470" y="190" width="150" height="85" rx="12" class="g"/><text x="505" y="225" class="h">Approve</text><text x="495" y="250" class="s">controls + gate</text><rect x="670" y="190" width="150" height="85" rx="12" class="t"/><text x="710" y="225" class="h">Operate</text><text x="695" y="250" class="s">monitor + evidence</text><rect x="870" y="190" width="150" height="85" rx="12" class="o"/><text x="905" y="225" class="h">Change</text><text x="890" y="250" class="s">materiality check</text><path d="M220 232H270M420 232H470M620 232H670M820 232H870" class="l"/><path d="M945 275V365H195V275" class="l"/><rect x="70" y="380" width="170" height="80" rx="12" class="n"/><text x="105" y="415" class="h">Recertify</text><text x="95" y="440" class="s">renew / suspend</text><rect x="350" y="380" width="170" height="80" rx="12" class="o"/><text x="385" y="415" class="h">Incident</text><text x="375" y="440" class="s">contain + learn</text><rect x="630" y="380" width="170" height="80" rx="12" class="t"/><text x="655" y="415" class="h">Audit</text><text x="650" y="440" class="s">assurance package</text><rect x="910" y="380" width="170" height="80" rx="12" class="g"/><text x="945" y="415" class="h">Improve</text><text x="930" y="440" class="s">policy + tests</text><path d="M240 420H350M520 420H630M800 420H910" class="l"/></svg>
