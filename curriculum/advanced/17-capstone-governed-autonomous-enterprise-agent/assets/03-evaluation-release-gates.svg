<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Continuous evaluation and release gates</title><desc id="d">A candidate agent is evaluated across outcome, trajectory, authorization, security, evidence, cost, and reliability before deployment.</desc><rect width="1200" height="560" fill="#F7F9FC"/><style>text{font-family:Arial,sans-serif;fill:#16324F}.h{font-weight:700}.s{font-size:15px}.c{fill:#fff;stroke:#D7DEE8;stroke-width:2}.b{fill:#EAF0FF;stroke:#2F6BFF;stroke-width:2}.g{fill:#F0EDFF;stroke:#7667E8;stroke-width:2}.t{fill:#E7F8F7;stroke:#16A3A5;stroke-width:2}.o{fill:#FFF1E3;stroke:#F59E42;stroke-width:2}.l{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#52606D"/></marker></defs><text x="60" y="55" font-size="30" class="h">Release is an evidence decision, not a single accuracy score</text><rect x="60" y="170" width="190" height="110" rx="14" class="c"/><text x="95" y="210" class="h">Candidate</text><text x="95" y="240" class="s">agent + policy + tools</text><rect x="320" y="115" width="250" height="220" rx="14" class="b"/><text x="355" y="155" class="h">Evaluation matrix</text><text x="355" y="190" class="s">task outcome</text><text x="355" y="215" class="s">trajectory + tools</text><text x="355" y="240" class="s">authorization = 100%</text><text x="355" y="265" class="s">security regressions = 0</text><text x="355" y="290" class="s">evidence completeness</text><rect x="640" y="115" width="220" height="220" rx="14" class="g"/><text x="680" y="155" class="h">Governance gate</text><text x="680" y="195" class="s">risk slices</text><text x="680" y="220" class="s">confidence bounds</text><text x="680" y="245" class="s">change materiality</text><text x="680" y="270" class="s">residual risk</text><rect x="930" y="115" width="190" height="90" rx="14" class="t"/><text x="985" y="155" class="h">Deploy</text><text x="980" y="180" class="s">bounded canary</text><rect x="930" y="245" width="190" height="90" rx="14" class="o"/><text x="985" y="285" class="h">Block / constrain</text><text x="975" y="310" class="s">remediate + retest</text><path d="M250 225H320M570 225H640M860 180H930M860 270H930" class="l"/><rect x="320" y="420" width="540" height="70" rx="14" class="c"/><text x="395" y="463" class="h">Production drift → near miss → regression case → re-evaluate</text></svg>
