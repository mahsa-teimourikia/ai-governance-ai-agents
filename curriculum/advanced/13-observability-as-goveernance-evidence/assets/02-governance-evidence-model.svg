<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">The Governance Evidence Model</text><text x="65" y="245" font-size="22" fill="#60758A">Capture enough context to answer accountability questions after the fact.</text><rect x="110" y="330" width="380" height="155" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="300" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#1769C2">IDENTITY</text><text x="300" y="432" text-anchor="middle" font-size="16" fill="#60758A">principal + agent</text><rect x="610" y="330" width="380" height="155" rx="22" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="800" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#805AD5">INTENT</text><text x="800" y="432" text-anchor="middle" font-size="16" fill="#60758A">goal + purpose</text><rect x="1110" y="330" width="380" height="155" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="1300" y="388" text-anchor="middle" font-size="20" font-weight="700" fill="#129B96">CONTEXT</text><text x="1300" y="432" text-anchor="middle" font-size="16" fill="#60758A">sources + trust</text><rect x="110" y="550" width="380" height="155" rx="22" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="300" y="608" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">AUTHORITY</text><text x="300" y="652" text-anchor="middle" font-size="16" fill="#60758A">scope + delegation</text><rect x="610" y="550" width="380" height="155" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="800" y="608" text-anchor="middle" font-size="20" font-weight="700" fill="#2F855A">DECISION</text><text x="800" y="652" text-anchor="middle" font-size="16" fill="#60758A">allow/deny/escalate</text><rect x="1110" y="550" width="380" height="155" rx="22" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="1300" y="608" text-anchor="middle" font-size="20" font-weight="700" fill="#C53030">OUTCOME</text><text x="1300" y="652" text-anchor="middle" font-size="16" fill="#60758A">effect + verification</text><text x="800" y="800" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Evidence is useful only when telemetry preserves the context needed to explain the action.</text></g></svg>