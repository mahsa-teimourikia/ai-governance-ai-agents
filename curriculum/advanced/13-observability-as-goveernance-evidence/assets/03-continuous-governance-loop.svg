<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Observability Closes the Governance Loop</text><text x="65" y="245" font-size="22" fill="#60758A">Evidence supports detection, correction, policy updates and continuous assurance.</text><circle cx="165" cy="450" r="88" fill="#FFFFFF" stroke="#1769C2" stroke-width="4"/><text x="165" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#1769C2">OBSERVE</text><line x1="253" y1="450" x2="303" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="415" cy="450" r="88" fill="#FFFFFF" stroke="#805AD5" stroke-width="4"/><text x="415" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#805AD5">EVALUATE</text><line x1="503" y1="450" x2="553" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="665" cy="450" r="88" fill="#FFFFFF" stroke="#C53030" stroke-width="4"/><text x="665" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#C53030">DETECT</text><line x1="753" y1="450" x2="803" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="915" cy="450" r="88" fill="#FFFFFF" stroke="#B9571D" stroke-width="4"/><text x="915" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#B9571D">CORRECT</text><line x1="1003" y1="450" x2="1053" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="1165" cy="450" r="88" fill="#FFFFFF" stroke="#129B96" stroke-width="4"/><text x="1165" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#129B96">UPDATE POLICY</text><line x1="1253" y1="450" x2="1303" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="1415" cy="450" r="88" fill="#FFFFFF" stroke="#2F855A" stroke-width="4"/><text x="1415" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="#2F855A">VERIFY</text><path d="M1415 560 C1415 700,185 700,185 560" fill="none" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><text x="800" y="750" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Telemetry becomes governance when it continuously changes controls and verifies the result.</text></g></svg>