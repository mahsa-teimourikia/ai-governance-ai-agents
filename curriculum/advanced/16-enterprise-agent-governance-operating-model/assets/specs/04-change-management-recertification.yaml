version: 1
id: course16-change-management-recertification
title: "Change Management and Recertification"
purpose: "Show how materiality analysis invalidates prior approval and selects the required governance route."
output:
  svg: ../04-change-management-recertification.svg
  medium: documentation
  alt_text: "A materiality engine evaluates changes to models, prompts, tools, data, permissions and authority, then routes them to regression testing, reassessment, reapproval, recertification or suspension."
canvas: { width: 1600, height: 900, background: "#F7F9FC", margin: 65, grid: 5 }
layout: { primary_flow: left-to-right, min_node_gap: 115, min_layer_gap: 80, node_padding: { x: 24, y: 16 } }
style:
  font_family: "Arial, Helvetica, sans-serif"
  title_color: "#082542"
  semantic_colors:
    change: { fill: "#FFFFFF", stroke: "#1769C2" }
    decision: { fill: "#FFFFFF", stroke: "#805AD5" }
    route: { fill: "#FFFFFF", stroke: "#B9571D" }
    assurance: { fill: "#082542", stroke: "#082542" }
groups:
  - id: recertification_assurance
    label: "Recertification validates ownership, purpose, dependencies, controls and evidence—not just model performance."
    bounds: { x: 110, y: 675, width: 1380, height: 80 }
nodes:
  - { id: change_detected, label: "CHANGE DETECTED", subtitle: "model • prompt • tool • MCP • policy • data • memory • autonomy", type: change, bounds: { x: 90, y: 350, width: 310, height: 190 }, ports: { out: { side: right, offset: 0.5 } } }
  - { id: materiality_engine, label: "MATERIALITY ENGINE", subtitle: "risk delta • control impact • permissions • data • consequence boundary", type: decision, bounds: { x: 515, y: 330, width: 350, height: 230 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: governance_route, label: "GOVERNANCE ROUTE", subtitle: "regression • reassessment • reapproval • suspension", type: route, bounds: { x: 980, y: 315, width: 500, height: 260 }, ports: { in: { side: left, offset: 0.5 } } }
edges:
  - { id: change_to_materiality, from: { node: change_detected, port: out }, to: { node: materiality_engine, port: in }, route: [[400, 445], [515, 445]] }
  - { id: materiality_to_route, from: { node: materiality_engine, port: out }, to: { node: governance_route, port: in }, route: [[865, 445], [980, 445]] }
validation: { no_overlaps: true, route_around_nodes: true, min_text_padding: 16, min_connector_clearance: 12, verify_port_attachment: true, verify_contrast: true }
source:
  renderer: "deterministic hand-authored SVG"
  note: "Coordinates, labels, colors and routes in this specification are authoritative."
