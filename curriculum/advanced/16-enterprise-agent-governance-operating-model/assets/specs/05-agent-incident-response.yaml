    containment: { fill: "#FFFFFF", stroke: "#C53030" }
    evidence: { fill: "#FFFFFF", stroke: "#805AD5" }
    impact: { fill: "#FFFFFF", stroke: "#B9571D" }
    recovery: { fill: "#FFFFFF", stroke: "#2F855A" }
    learning: { fill: "#FFFFFF", stroke: "#129B96" }
groups: []
