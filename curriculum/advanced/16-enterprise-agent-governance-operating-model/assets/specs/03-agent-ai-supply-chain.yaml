version: 1
id: course16-agent-ai-supply-chain
title: "Agent and AI Supply Chain Governance"
purpose: "Trace governed dependencies and evidence from upstream components into the enterprise runtime."
output:
  svg: ../03-agent-ai-supply-chain.svg
  medium: documentation
  alt_text: "Foundation models, libraries, container images, MCP servers, tools, data, knowledge and the agent package feed the enterprise runtime under provenance, version, license, vulnerability, signature, trust and change controls."
canvas: { width: 1600, height: 900, background: "#F7F9FC", margin: 35, grid: 5 }
layout: { primary_flow: left-to-right, min_node_gap: 50, min_layer_gap: 80, node_padding: { x: 20, y: 14 } }
style:
  font_family: "Arial, Helvetica, sans-serif"
  title_color: "#082542"
  semantic_colors:
    dependency: { fill: "#FFFFFF", stroke: "#1769C2" }
    evidence: { fill: "#082542", stroke: "#082542" }
groups:
  - id: evidence_layer
    label: "PROVENANCE • VERSION • LICENSE • VULNERABILITY • SIGNATURE • TRUST • CHANGE"
    bounds: { x: 250, y: 620, width: 1100, height: 95 }
nodes:
  - { id: foundation_model, label: "FOUNDATION MODEL", type: dependency, bounds: { x: 35, y: 365, width: 205, height: 155 }, ports: { out: { side: right, offset: 0.5 } } }
  - { id: libraries_images, label: "LIBRARIES / IMAGES", type: dependency, bounds: { x: 290, y: 365, width: 205, height: 155 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: mcp_tools, label: "MCP / TOOLS", type: dependency, bounds: { x: 545, y: 365, width: 205, height: 155 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: data_knowledge, label: "DATA / KNOWLEDGE", type: dependency, bounds: { x: 800, y: 365, width: 205, height: 155 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: agent_package, label: "AGENT PACKAGE", type: dependency, bounds: { x: 1055, y: 365, width: 205, height: 155 }, ports: { in: { side: left, offset: 0.5 }, out: { side: right, offset: 0.5 } } }
  - { id: enterprise_runtime, label: "ENTERPRISE RUNTIME", type: dependency, bounds: { x: 1310, y: 365, width: 205, height: 155 }, ports: { in: { side: left, offset: 0.5 } } }
edges:
  - { id: model_to_libraries, from: { node: foundation_model, port: out }, to: { node: libraries_images, port: in }, route: [[240, 442], [290, 442]] }
  - { id: libraries_to_tools, from: { node: libraries_images, port: out }, to: { node: mcp_tools, port: in }, route: [[495, 442], [545, 442]] }
  - { id: tools_to_data, from: { node: mcp_tools, port: out }, to: { node: data_knowledge, port: in }, route: [[750, 442], [800, 442]] }
  - { id: data_to_package, from: { node: data_knowledge, port: out }, to: { node: agent_package, port: in }, route: [[1005, 442], [1055, 442]] }
  - { id: package_to_runtime, from: { node: agent_package, port: out }, to: { node: enterprise_runtime, port: in }, route: [[1260, 442], [1310, 442]] }
validation: { no_overlaps: true, route_around_nodes: true, min_text_padding: 14, min_connector_clearance: 12, verify_port_attachment: true, verify_contrast: true }
source:
  renderer: "deterministic hand-authored SVG"
  note: "Coordinates, labels, colors and routes in this specification are authoritative."
