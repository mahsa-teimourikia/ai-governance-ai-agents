<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="75" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="120" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="190" font-size="42" font-weight="700" fill="#082542">Change Management &amp; Recertification</text>
<text x="65" y="230" font-size="21" fill="#60758A">Agent governance must detect when a change invalidates a previous approval.</text>

<rect x="90" y="350" width="310" height="190" rx="24" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/>
<text x="245" y="405" text-anchor="middle" font-size="19" font-weight="700" fill="#1769C2">CHANGE DETECTED</text>
<text x="245" y="450" text-anchor="middle" font-size="15" fill="#60758A">model • prompt • tool • MCP</text>
<text x="245" y="480" text-anchor="middle" font-size="15" fill="#60758A">policy • data • memory • autonomy</text>
<line x1="400" y1="445" x2="500" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="515" y="330" width="350" height="230" rx="24" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/>
<text x="690" y="390" text-anchor="middle" font-size="19" font-weight="700" fill="#805AD5">MATERIALITY ENGINE</text>
<text x="690" y="435" text-anchor="middle" font-size="15" fill="#60758A">risk delta • control impact</text>
<text x="690" y="468" text-anchor="middle" font-size="15" fill="#60758A">new permissions • new data</text>
<text x="690" y="501" text-anchor="middle" font-size="15" fill="#60758A">new consequence boundary</text>
<line x1="865" y1="445" x2="965" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="980" y="315" width="500" height="260" rx="24" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/>
<text x="1230" y="370" text-anchor="middle" font-size="19" font-weight="700" fill="#B9571D">GOVERNANCE ROUTE</text>
<text x="1230" y="420" text-anchor="middle" font-size="16" fill="#2F855A">NON-MATERIAL → automated regression</text>
<text x="1230" y="460" text-anchor="middle" font-size="16" fill="#B7791F">MATERIAL → targeted reassessment</text>
<text x="1230" y="500" text-anchor="middle" font-size="16" fill="#C53030">MAJOR → re-approval / recertification</text>
<text x="1230" y="540" text-anchor="middle" font-size="16" fill="#805AD5">CRITICAL → suspend until approved</text>
<rect x="360" y="675" width="880" height="80" rx="20" fill="#082542"/>
<text x="800" y="725" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Recertification validates ownership, purpose, dependencies, controls and evidence—not just model performance.</text>
</g></svg>