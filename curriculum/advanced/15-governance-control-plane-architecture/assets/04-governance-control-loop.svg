<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">The Control Plane Closes the Governance Loop</text><text x="65" y="245" font-size="22" fill="#60758A">Governance becomes an operational system rather than a collection of disconnected controls.</text><circle cx="150" cy="445" r="85" fill="#FFFFFF" stroke="#1769C2" stroke-width="4"/><text x="150" y="453" text-anchor="middle" font-size="18" font-weight="700" fill="#1769C2">REGISTER</text><line x1="235" y1="445" x2="288" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="402" cy="445" r="85" fill="#FFFFFF" stroke="#805AD5" stroke-width="4"/><text x="402" y="453" text-anchor="middle" font-size="18" font-weight="700" fill="#805AD5">AUTHORIZE</text><line x1="487" y1="445" x2="540" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="654" cy="445" r="85" fill="#FFFFFF" stroke="#C53030" stroke-width="4"/><text x="654" y="453" text-anchor="middle" font-size="18" font-weight="700" fill="#C53030">ENFORCE</text><line x1="739" y1="445" x2="792" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="906" cy="445" r="85" fill="#FFFFFF" stroke="#129B96" stroke-width="4"/><text x="906" y="453" text-anchor="middle" font-size="18" font-weight="700" fill="#129B96">OBSERVE</text><line x1="991" y1="445" x2="1044" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="1158" cy="445" r="85" fill="#FFFFFF" stroke="#2F855A" stroke-width="4"/><text x="1158" y="453" text-anchor="middle" font-size="18" font-weight="700" fill="#2F855A">EVALUATE</text><line x1="1243" y1="445" x2="1296" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><circle cx="1410" cy="445" r="85" fill="#FFFFFF" stroke="#B9571D" stroke-width="4"/><text x="1410" y="453" text-anchor="middle" font-size="18" font-weight="700" fill="#B9571D">UPDATE</text><path d="M1410 555 C1410 700,180 700,180 555" fill="none" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><text x="800" y="765" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Runtime evidence continuously improves policy, permissions, risk thresholds and autonomy.</text></g></svg>