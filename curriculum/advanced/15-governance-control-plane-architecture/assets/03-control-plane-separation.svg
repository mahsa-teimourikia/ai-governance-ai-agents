<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Separate Management, Decision, Enforcement &amp; Evidence</text><text x="65" y="245" font-size="22" fill="#60758A">A scalable control plane coordinates policy without becoming a single fragile choke point.</text><rect x="250" y="310" width="1100" height="92" rx="20" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="315" y="348" font-size="19" font-weight="700" fill="#1769C2">MANAGEMENT</text><text x="650" y="348" font-size="17" fill="#60758A">registry • lifecycle • versions</text><rect x="250" y="435" width="1100" height="92" rx="20" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="315" y="473" font-size="19" font-weight="700" fill="#B9571D">DECISION</text><text x="650" y="473" font-size="17" fill="#60758A">policy • risk • authorization</text><rect x="250" y="560" width="1100" height="92" rx="20" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="315" y="598" font-size="19" font-weight="700" fill="#C53030">ENFORCEMENT</text><text x="650" y="598" font-size="17" fill="#60758A">gateway • tool proxy • data boundary</text><rect x="250" y="685" width="1100" height="92" rx="20" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="315" y="723" font-size="19" font-weight="700" fill="#129B96">EVIDENCE</text><text x="650" y="723" font-size="17" fill="#60758A">trace • audit • evaluation</text><text x="800" y="825" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Centralize governance logic; distribute enforcement close to the action.</text></g></svg>