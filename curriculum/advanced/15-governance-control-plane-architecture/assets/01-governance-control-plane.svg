<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Governance Control Plane Architecture</text><text x="65" y="245" font-size="22" fill="#60758A">Separate probabilistic reasoning from deterministic authority and enforcement.</text><rect x="70" y="330" width="300" height="220" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="220" y="390" text-anchor="middle" font-size="21" font-weight="700" fill="#1769C2">AGENT RUNTIME</text><text x="220" y="435" text-anchor="middle" font-size="16" fill="#60758A">plan • retrieve • delegate</text><text x="220" y="470" text-anchor="middle" font-size="16" fill="#60758A">propose action</text><line x1="370" y1="440" x2="455" y2="440" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/><rect x="470" y="290" width="650" height="310" rx="25" fill="#082542"/><text x="795" y="345" text-anchor="middle" font-size="23" font-weight="700" fill="#B9571D">GOVERNANCE CONTROL PLANE</text><text x="795" y="400" text-anchor="middle" font-size="17" fill="#FFFFFF">Identity • Delegation • Authorization • Policy</text><text x="795" y="440" text-anchor="middle" font-size="17" fill="#FFFFFF">Risk • Data Classification • Guardrails</text><text x="795" y="480" text-anchor="middle" font-size="17" fill="#FFFFFF">Approval Routing • Evidence • Evaluation</text><text x="795" y="535" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">ALLOW • DENY • ESCALATE • CONSTRAIN</text><line x1="1120" y1="440" x2="1205" y2="440" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/><rect x="1220" y="330" width="310" height="220" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1375" y="390" text-anchor="middle" font-size="21" font-weight="700" fill="#2F855A">ACTION SURFACE</text><text x="1375" y="435" text-anchor="middle" font-size="16" fill="#60758A">Tool • API • MCP</text><text x="1375" y="470" text-anchor="middle" font-size="16" fill="#60758A">Agent • Data • System</text><text x="800" y="740" text-anchor="middle" font-size="21" font-weight="700" fill="#082542">Reasoning proposes. The control plane decides whether authority permits consequence.</text></g></svg>