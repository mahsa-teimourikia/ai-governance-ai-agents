<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>The Delegation Contract</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">The Delegation Contract</text><text x="65" y="245" font-size="22" fill="#60758A">Make every agent-to-agent transfer explicit, bounded, attributable, and expiring.</text>
<rect x="100" y="310" width="1400" height="390" rx="30" fill="#082542"/>
<text x="800" y="365" text-anchor="middle" font-size="24" font-weight="700" fill="#B9571D">DELEGATION CONTRACT</text>
<rect x="155" y="405" width="390" height="100" rx="18" fill="#FFFFFF"/><text x="183" y="445" font-size="18" font-weight="700" fill="#1769C2">WHO</text><text x="183" y="477" font-size="17" fill="#60758A">caller + callee</text><rect x="620" y="405" width="390" height="100" rx="18" fill="#FFFFFF"/><text x="648" y="445" font-size="18" font-weight="700" fill="#805AD5">WHY</text><text x="648" y="477" font-size="17" fill="#60758A">task + purpose</text><rect x="1085" y="405" width="390" height="100" rx="18" fill="#FFFFFF"/><text x="1113" y="445" font-size="18" font-weight="700" fill="#129B96">WHAT</text><text x="1113" y="477" font-size="17" fill="#60758A">scope + resources</text><rect x="155" y="540" width="390" height="100" rx="18" fill="#FFFFFF"/><text x="183" y="580" font-size="18" font-weight="700" fill="#B9571D">POWER</text><text x="183" y="612" font-size="17" fill="#60758A">tools + permissions</text><rect x="620" y="540" width="390" height="100" rx="18" fill="#FFFFFF"/><text x="648" y="580" font-size="18" font-weight="700" fill="#2F855A">LIMITS</text><text x="648" y="612" font-size="17" fill="#60758A">budget + TTL + depth</text><rect x="1085" y="540" width="390" height="100" rx="18" fill="#FFFFFF"/><text x="1113" y="580" font-size="18" font-weight="700" fill="#C53030">EVIDENCE</text><text x="1113" y="612" font-size="17" fill="#60758A">parent + trace + policy</text><text x="800" y="790" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Delegation is an explicit security event—not merely a message between agents.</text></g></svg>