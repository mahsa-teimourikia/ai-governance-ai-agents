<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Multi-Agent Delegation Chain</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Multi-Agent Delegation Chain</text><text x="65" y="245" font-size="22" fill="#60758A">Preserve identity, purpose, scope, provenance, and limits at every delegation hop.</text>
<rect x="75" y="355" width="240" height="190" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="195" y="415" text-anchor="middle" font-size="22" font-weight="700" fill="#1769C2">HUMAN</text><text x="195" y="460" text-anchor="middle" font-size="17" fill="#60758A">Original authority</text>
<line x1="315" y1="450" x2="405" y2="450" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="420" y="330" width="280" height="240" rx="24" fill="#082542"/><text x="560" y="390" text-anchor="middle" font-size="22" font-weight="700" fill="#B9571D">MANAGER AGENT</text><text x="560" y="435" text-anchor="middle" font-size="17" fill="#FFFFFF">Scoped grant</text><text x="560" y="472" text-anchor="middle" font-size="17" fill="#FFFFFF">Task • purpose • budget</text><text x="560" y="509" text-anchor="middle" font-size="17" fill="#FFFFFF">delegation depth</text>
<line x1="700" y1="450" x2="790" y2="450" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="805" y="345" width="270" height="210" rx="22" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="940" y="405" text-anchor="middle" font-size="22" font-weight="700" fill="#805AD5">SPECIALIST</text><text x="940" y="450" text-anchor="middle" font-size="17" fill="#60758A">Narrower authority</text><text x="940" y="487" text-anchor="middle" font-size="17" fill="#60758A">No privilege amplification</text>
<line x1="1075" y1="450" x2="1165" y2="450" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="1180" y="355" width="340" height="190" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1350" y="415" text-anchor="middle" font-size="22" font-weight="700" fill="#2F855A">TOOL / API / AGENT</text><text x="1350" y="460" text-anchor="middle" font-size="17" fill="#60758A">Effective authority = intersection</text><text x="1350" y="495" text-anchor="middle" font-size="17" fill="#60758A">of every upstream grant</text>
<rect x="210" y="710" width="1180" height="70" rx="18" fill="#FFF0E7"/><text x="800" y="753" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">Authority should normally narrow as it moves through the delegation chain.</text></g></svg>