<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Orchestration Pattern = Governance Choice</text><text x="65" y="245" font-size="22" fill="#60758A">Manager, handoff, pipeline, parallel, and dynamic teams create different authority models.</text><rect x="45" y="340" width="265" height="210" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="177" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#1769C2">MANAGER</text><text x="177" y="455" text-anchor="middle" font-size="17" fill="#60758A">Central owner</text><text x="177" y="495" text-anchor="middle" font-size="16" fill="#102A43">Different control surface</text><rect x="350" y="340" width="265" height="210" rx="22" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="482" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#805AD5">HANDOFF</text><text x="482" y="455" text-anchor="middle" font-size="17" fill="#60758A">Control transfers</text><text x="482" y="495" text-anchor="middle" font-size="16" fill="#102A43">Different control surface</text><rect x="655" y="340" width="265" height="210" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="787" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#129B96">SEQUENTIAL</text><text x="787" y="455" text-anchor="middle" font-size="17" fill="#60758A">Fixed stages</text><text x="787" y="495" text-anchor="middle" font-size="16" fill="#102A43">Different control surface</text><rect x="960" y="340" width="265" height="210" rx="22" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="1092" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">CONCURRENT</text><text x="1092" y="455" text-anchor="middle" font-size="17" fill="#60758A">Parallel workers</text><text x="1092" y="495" text-anchor="middle" font-size="16" fill="#102A43">Different control surface</text><rect x="1265" y="340" width="265" height="210" rx="22" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="1397" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#C53030">GROUP / MAGENTIC</text><text x="1397" y="455" text-anchor="middle" font-size="17" fill="#60758A">Dynamic collaboration</text><text x="1397" y="495" text-anchor="middle" font-size="16" fill="#102A43">Different control surface</text><rect x="205" y="690" width="1190" height="85" rx="18" fill="#082542"/><text x="800" y="725" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Choose the simplest orchestration that satisfies the task.</text><text x="800" y="755" text-anchor="middle" font-size="18" fill="#FFFFFF">More dynamic coordination means more delegation, context, concurrency, and audit risk.</text></g></svg>