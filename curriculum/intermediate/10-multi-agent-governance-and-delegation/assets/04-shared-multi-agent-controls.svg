<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Multi-Agent Controls Must Be Global Where Risk Is Global</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Multi-Agent Controls Must Be Global Where Risk Is Global</text><text x="65" y="245" font-size="22" fill="#60758A">Parallel agents need shared budgets, halt propagation, authoritative state, and coordinated audit.</text>
<rect x="90" y="315" width="300" height="300" rx="28" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="240" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#1769C2">AGENT A</text><text x="240" y="420" text-anchor="middle" font-size="17" fill="#60758A">Planner</text>
<rect x="650" y="315" width="300" height="300" rx="28" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="800" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#805AD5">AGENT B</text><text x="800" y="420" text-anchor="middle" font-size="17" fill="#60758A">Executor</text>
<rect x="1210" y="315" width="300" height="300" rx="28" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="1360" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#129B96">AGENT C</text><text x="1360" y="420" text-anchor="middle" font-size="17" fill="#60758A">Verifier</text>
<rect x="395" y="650" width="810" height="115" rx="22" fill="#082542"/><text x="800" y="690" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">SHARED GOVERNANCE STATE</text><text x="800" y="728" text-anchor="middle" font-size="17" fill="#FFFFFF">scope • budget • halt • authority • task state • evidence</text>
<line x1="240" y1="615" x2="520" y2="650" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><line x1="800" y1="615" x2="800" y2="650" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><line x1="1360" y1="615" x2="1080" y2="650" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/>
<text x="240" y="490" text-anchor="middle" font-size="16" fill="#102A43">Local limit ≠ global limit</text><text x="800" y="490" text-anchor="middle" font-size="16" fill="#102A43">Local halt ≠ global halt</text><text x="1360" y="490" text-anchor="middle" font-size="16" fill="#102A43">Local state ≠ truth</text></g></svg>