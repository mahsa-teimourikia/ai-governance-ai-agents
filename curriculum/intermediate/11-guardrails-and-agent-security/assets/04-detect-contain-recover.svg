<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">From Guardrail to Security Response</text><text x="65" y="245" font-size="22" fill="#60758A">Detection matters only when the architecture can contain and recover.</text><circle cx="320" cy="470" r="145" fill="#FFFFFF" stroke="#1769C2" stroke-width="4"/><text x="320" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#1769C2">DETECT</text><text x="320" y="495" text-anchor="middle" font-size="16" fill="#60758A">Injection • anomaly</text><line x1="465" y1="470" x2="655" y2="470" stroke="#B9571D" stroke-width="6" marker-end="url(#a)"/><circle cx="800" cy="470" r="145" fill="#082542"/><text x="800" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#B9571D">CONTAIN</text><text x="800" y="495" text-anchor="middle" font-size="16" fill="#FFFFFF">Block • revoke • isolate</text><line x1="945" y1="470" x2="1135" y2="470" stroke="#B9571D" stroke-width="6" marker-end="url(#a)"/><circle cx="1280" cy="470" r="145" fill="#FFFFFF" stroke="#2F855A" stroke-width="4"/><text x="1280" y="450" text-anchor="middle" font-size="22" font-weight="700" fill="#2F855A">RECOVER</text><text x="1280" y="495" text-anchor="middle" font-size="16" fill="#60758A">Verify • restore • learn</text><text x="800" y="750" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Autonomous-system security includes incident response because agents create side effects.</text></g></svg>