<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs><rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial"><text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text><text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text><text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Risk-Based Guardrail Routing</text><text x="65" y="245" font-size="22" fill="#60758A">Match enforcement strength to consequence and uncertainty.</text><rect x="80" y="350" width="260" height="190" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="210" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#1769C2">ACTION</text><text x="210" y="465" text-anchor="middle" font-size="17" fill="#60758A">Intent + arguments</text><line x1="340" y1="445" x2="440" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/><rect x="455" y="300" width="420" height="290" rx="25" fill="#082542"/><text x="665" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#B9571D">RUNTIME RISK ENGINE</text><text x="665" y="420" text-anchor="middle" font-size="17" fill="#FFFFFF">Impact • identity • trust • access</text><text x="665" y="460" text-anchor="middle" font-size="17" fill="#FFFFFF">anomaly • reversibility • policy</text><text x="665" y="520" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">DETERMINISTIC POLICY WINS</text><line x1="875" y1="445" x2="975" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/><rect x="990" y="310" width="530" height="270" rx="25" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="1040" y="370" font-size="19" font-weight="700" fill="#2F855A">LOW</text><text x="1200" y="370" font-size="17">Allow + observe</text><text x="1040" y="425" font-size="19" font-weight="700" fill="#1769C2">MEDIUM</text><text x="1200" y="425" font-size="17">Validate / constrain</text><text x="1040" y="480" font-size="19" font-weight="700" fill="#B9571D">HIGH</text><text x="1200" y="480" font-size="17">Approve / sandbox</text><text x="1040" y="535" font-size="19" font-weight="700" fill="#C53030">CRITICAL</text><text x="1200" y="535" font-size="17">Deny / terminate</text><text x="800" y="750" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">A guardrail should change execution—not merely produce a warning.</text></g></svg>