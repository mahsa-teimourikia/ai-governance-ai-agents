<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900">
  <title>Trust boundaries before agent consequences</title>
  <desc>Untrusted user, retrieval, web, email, tool, and agent content passes through an application-owned security control plane before it can cause a tool, API, code, write, payment, or message effect.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8z" fill="#B9571D"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <g font-family="Arial">
    <text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
    <text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
    <text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Trust Boundaries Before Consequence</text>
    <text x="65" y="245" font-size="22" fill="#60758A">Separate what the model can read from what the system is authorized to do.</text>
    <rect x="70" y="330" width="310" height="250" rx="24" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/>
    <text x="225" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#C53030">UNTRUSTED CONTENT</text>
    <text x="225" y="450" text-anchor="middle" font-size="17" fill="#60758A">User &#x2022; RAG &#x2022; web</text>
    <text x="225" y="490" text-anchor="middle" font-size="17" fill="#60758A">email &#x2022; tool &#x2022; agent</text>
    <line x1="380" y1="455" x2="480" y2="455" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
    <rect x="495" y="295" width="610" height="320" rx="28" fill="#082542"/>
    <text x="800" y="360" text-anchor="middle" font-size="23" font-weight="700" fill="#B9571D">SECURITY CONTROL PLANE</text>
    <text x="800" y="415" text-anchor="middle" font-size="17" fill="#FFFFFF">Identity &#x2022; AuthZ &#x2022; Policy &#x2022; Trust labels</text>
    <text x="800" y="460" text-anchor="middle" font-size="17" fill="#FFFFFF">Guardrails &#x2022; Approval &#x2022; Sandbox &#x2022; Budgets</text>
    <text x="800" y="505" text-anchor="middle" font-size="17" fill="#FFFFFF">Egress &#x2022; Secrets &#x2022; Audit &#x2022; Kill / Revoke</text>
    <text x="800" y="560" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">ALLOW &#x2022; TRANSFORM &#x2022; ESCALATE &#x2022; DENY</text>
    <line x1="1105" y1="455" x2="1205" y2="455" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
    <rect x="1220" y="330" width="310" height="250" rx="24" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/>
    <text x="1375" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#2F855A">CONSEQUENCE</text>
    <text x="1375" y="450" text-anchor="middle" font-size="17" fill="#60758A">Tool &#x2022; API &#x2022; code</text>
    <text x="1375" y="490" text-anchor="middle" font-size="17" fill="#60758A">write &#x2022; payment &#x2022; send</text>
    <text x="800" y="755" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Content may influence reasoning. It must not directly acquire authority.</text>
  </g>
</svg>
