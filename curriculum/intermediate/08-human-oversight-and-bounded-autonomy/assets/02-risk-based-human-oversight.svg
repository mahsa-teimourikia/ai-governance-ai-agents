<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Risk-Based Human Oversight</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Risk-Based Human Oversight</text>
<text x="65" y="245" font-size="22" fill="#60758A">Route actions according to consequence and uncertainty instead of approving every tool call.</text><rect x="100" y="315" width="1400" height="88" rx="18" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="150" y="370" font-size="25" font-weight="700" fill="#2F855A">$40</text><text x="410" y="370" font-size="21" font-weight="700" fill="#082542">AUTO-ALLOW</text><text x="900" y="370" font-size="18" fill="#60758A">Low impact • reversible</text><rect x="100" y="430" width="1400" height="88" rx="18" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="150" y="485" font-size="25" font-weight="700" fill="#129B96">$2K</text><text x="410" y="485" font-size="21" font-weight="700" fill="#082542">VERIFY</text><text x="900" y="485" font-size="18" fill="#60758A">Novel / unusual</text><rect x="100" y="545" width="1400" height="88" rx="18" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="150" y="600" font-size="25" font-weight="700" fill="#B9571D">$25K</text><text x="410" y="600" font-size="21" font-weight="700" fill="#082542">MANAGER APPROVAL</text><text x="900" y="600" font-size="18" fill="#60758A">Material consequence</text><rect x="100" y="660" width="1400" height="88" rx="18" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="150" y="715" font-size="25" font-weight="700" fill="#C53030">$500K</text><text x="410" y="715" font-size="21" font-weight="700" fill="#082542">MULTI-PARTY</text><text x="900" y="715" font-size="18" fill="#60758A">Irreversible / critical</text><rect x="270" y="790" width="1060" height="55" rx="15" fill="#FFF0E7"/><text x="800" y="825" text-anchor="middle" font-size="19" font-weight="700" fill="#B9571D">Goal: meaningful human control—not maximum human involvement.</text></g></svg>