<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Human Oversight as a Control System</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Human Oversight as a Control System</text>
<text x="65" y="245" font-size="22" fill="#60758A">Oversight includes intervention, escalation, verification, evidence, and feedback—not only approval.</text><rect x="55" y="355" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="145" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#1769C2">PROPOSE</text><text x="145" y="462" text-anchor="middle" font-size="17" fill="#60758A">Agent</text><line x1="235" y1="445" x2="263" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="273" y="355" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="363" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#129B96">SCORE</text><text x="363" y="462" text-anchor="middle" font-size="17" fill="#60758A">Risk</text><line x1="453" y1="445" x2="481" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="491" y="355" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="581" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#805AD5">ROUTE</text><text x="581" y="462" text-anchor="middle" font-size="17" fill="#60758A">Policy</text><line x1="671" y1="445" x2="699" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="709" y="355" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="799" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#B9571D">REVIEW</text><text x="799" y="462" text-anchor="middle" font-size="17" fill="#60758A">Human</text><line x1="889" y1="445" x2="917" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="927" y="355" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1017" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#2F855A">EXECUTE</text><text x="1017" y="462" text-anchor="middle" font-size="17" fill="#60758A">Tool</text><line x1="1107" y1="445" x2="1135" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1145" y="355" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#082542" stroke-width="3"/><text x="1235" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#082542">VERIFY</text><text x="1235" y="462" text-anchor="middle" font-size="17" fill="#60758A">Outcome</text><line x1="1325" y1="445" x2="1353" y2="445" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1363" y="355" width="180" height="180" rx="22" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="1453" y="415" text-anchor="middle" font-size="19" font-weight="700" fill="#C53030">LEARN</text><text x="1453" y="462" text-anchor="middle" font-size="17" fill="#60758A">Evidence</text><path d="M1450 590 C1450 760 150 760 150 590" fill="none" stroke="#129B96" stroke-width="4" marker-end="url(#a)"/><text x="800" y="800" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Use outcomes and override data to tune thresholds—not to silently expand autonomy.</text></g></svg>