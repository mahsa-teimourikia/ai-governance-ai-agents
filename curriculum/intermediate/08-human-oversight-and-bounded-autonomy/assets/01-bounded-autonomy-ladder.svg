<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Bounded Autonomy</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Bounded Autonomy</text>
<text x="65" y="245" font-size="22" fill="#60758A">Autonomy is not binary. Increase independent action only inside explicit, testable boundaries.</text><rect x="80" y="560" width="330" height="170" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="4"/><text x="115" y="615" font-size="23" font-weight="700" fill="#2F855A">1  INFORMATIONAL</text><text x="115" y="660" font-size="18" fill="#102A43">Recommend</text><text x="115" y="695" font-size="17" fill="#60758A">Human acts</text><rect x="460" y="485" width="330" height="245" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="4"/><text x="495" y="540" font-size="23" font-weight="700" fill="#129B96">2  ASSISTED</text><text x="495" y="585" font-size="18" fill="#102A43">Prepare action</text><text x="495" y="620" font-size="17" fill="#60758A">Human approves</text><rect x="840" y="410" width="330" height="320" rx="22" fill="#FFFFFF" stroke="#B9571D" stroke-width="4"/><text x="875" y="465" font-size="23" font-weight="700" fill="#B9571D">3  BOUNDED</text><text x="875" y="510" font-size="18" fill="#102A43">Execute low-risk</text><text x="875" y="545" font-size="17" fill="#60758A">Escalate exceptions</text><rect x="1220" y="335" width="330" height="395" rx="22" fill="#FFFFFF" stroke="#C53030" stroke-width="4"/><text x="1255" y="390" font-size="23" font-weight="700" fill="#C53030">4  HIGH AUTONOMY</text><text x="1255" y="435" font-size="18" fill="#102A43">Plan + execute</text><text x="1255" y="470" font-size="17" fill="#60758A">Strict boundaries</text><text x="800" y="835" text-anchor="middle" font-size="21" font-weight="700" fill="#082542">Governance burden rises with autonomy × impact × access × irreversibility × uncertainty.</text></g></svg>