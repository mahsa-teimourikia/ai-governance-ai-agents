<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Runtime Enforcement Architecture</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Runtime Enforcement Architecture</text>
<text x="65" y="245" font-size="22" fill="#60758A">Put deterministic controls outside the agent and force consequential tool traffic through the governed boundary.</text>

<rect x="80" y="350" width="250" height="180" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="205" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#1769C2">AGENT</text><text x="205" y="460" text-anchor="middle" font-size="17" fill="#60758A">Proposed tool call</text>
<line x1="330" y1="440" x2="420" y2="440" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="435" y="315" width="320" height="250" rx="24" fill="#082542"/><text x="595" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#B9571D">GOVERNANCE GATEWAY</text><text x="595" y="425" text-anchor="middle" font-size="17" fill="#FFFFFF">Identity • Context • Policy</text><text x="595" y="462" text-anchor="middle" font-size="17" fill="#FFFFFF">Risk • Guardrails • Approval</text><text x="595" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Fail closed</text>
<line x1="755" y1="400" x2="865" y2="400" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="880" y="315" width="300" height="250" rx="24" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="1030" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#805AD5">POLICY ENGINE</text><text x="1030" y="425" text-anchor="middle" font-size="17" fill="#60758A">Cedar / OPA / managed PDP</text><text x="1030" y="475" text-anchor="middle" font-size="17" fill="#60758A">Versioned deterministic rules</text>
<line x1="755" y1="520" x2="1250" y2="610" stroke="#2F855A" stroke-width="5" marker-end="url(#a)"/>
<rect x="1260" y="550" width="260" height="145" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1390" y="610" text-anchor="middle" font-size="22" font-weight="700" fill="#2F855A">TOOL / API</text><text x="1390" y="650" text-anchor="middle" font-size="17" fill="#60758A">Executes only after allow</text>
<rect x="350" y="735" width="900" height="65" rx="16" fill="#FFF0E7"/><text x="800" y="775" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">A control boundary is useful only if agents cannot bypass it.</text>
</g></svg>