<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Layered Runtime Policy</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Layered Runtime Policy</text>
<text x="65" y="245" font-size="22" fill="#60758A">Authorization is one control layer. Runtime governance also evaluates business rules, risk, and safety constraints.</text>
<rect x="120" y="315" width="930" height="68" rx="17" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="160" y="357" font-size="19" font-weight="700" fill="#1769C2">IDENTITY</text><text x="470" y="357" font-size="18" fill="#60758A">Who is acting?</text><rect x="120" y="407" width="930" height="68" rx="17" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="160" y="449" font-size="19" font-weight="700" fill="#805AD5">AUTHORIZATION</text><text x="470" y="449" font-size="18" fill="#60758A">May they act?</text><rect x="120" y="499" width="930" height="68" rx="17" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="160" y="541" font-size="19" font-weight="700" fill="#B9571D">BUSINESS POLICY</text><text x="470" y="541" font-size="18" fill="#60758A">Should this action occur?</text><rect x="120" y="591" width="930" height="68" rx="17" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="160" y="633" font-size="19" font-weight="700" fill="#C53030">RISK</text><text x="470" y="633" font-size="18" fill="#60758A">Is escalation required?</text><rect x="120" y="683" width="930" height="68" rx="17" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="160" y="725" font-size="19" font-weight="700" fill="#129B96">SAFETY</text><text x="470" y="725" font-size="18" fill="#60758A">Content / data constraints</text><line x1="1080" y1="350" x2="1215" y2="530" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/><rect x="1230" y="430" width="290" height="205" rx="25" fill="#082542"/><text x="1375" y="490" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">RUNTIME DECISION</text><text x="1375" y="535" text-anchor="middle" font-size="20" font-weight="700" fill="#2F855A">ALLOW</text><text x="1375" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#C53030">DENY</text><text x="1375" y="615" text-anchor="middle" font-size="18" fill="#B9571D">ESCALATE</text></g></svg>