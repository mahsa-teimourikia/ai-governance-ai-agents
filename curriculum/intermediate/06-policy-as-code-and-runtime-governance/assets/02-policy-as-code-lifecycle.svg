<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Policy-as-Code Lifecycle</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Policy-as-Code Lifecycle</text>
<text x="65" y="245" font-size="22" fill="#60758A">A governance policy is a deployable control artifact—not merely a paragraph in a governance document.</text>
<rect x="55" y="350" width="180" height="210" rx="20" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="145" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#1769C2">AUTHOR</text><text x="145" y="465" text-anchor="middle" font-size="15" fill="#60758A">Requirements → policy</text><line x1="235" y1="455" x2="263" y2="455" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="273" y="350" width="180" height="210" rx="20" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="363" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#129B96">VALIDATE</text><text x="363" y="465" text-anchor="middle" font-size="15" fill="#60758A">Schema + syntax</text><line x1="453" y1="455" x2="481" y2="455" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="491" y="350" width="180" height="210" rx="20" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="581" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#805AD5">TEST</text><text x="581" y="465" text-anchor="middle" font-size="15" fill="#60758A">Positive + negative</text><line x1="671" y1="455" x2="699" y2="455" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="709" y="350" width="180" height="210" rx="20" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="799" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#B9571D">ANALYZE</text><text x="799" y="465" text-anchor="middle" font-size="15" fill="#60758A">Over/under-permission</text><line x1="889" y1="455" x2="917" y2="455" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="927" y="350" width="180" height="210" rx="20" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1017" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#2F855A">DEPLOY</text><text x="1017" y="465" text-anchor="middle" font-size="15" fill="#60758A">Versioned rollout</text><line x1="1107" y1="455" x2="1135" y2="455" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1145" y="350" width="180" height="210" rx="20" fill="#FFFFFF" stroke="#082542" stroke-width="3"/><text x="1235" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#082542">MONITOR</text><text x="1235" y="465" text-anchor="middle" font-size="15" fill="#60758A">Decisions + drift</text><line x1="1325" y1="455" x2="1353" y2="455" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1363" y="350" width="180" height="210" rx="20" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="1453" y="410" text-anchor="middle" font-size="18" font-weight="700" fill="#C53030">ROLL BACK</text><text x="1453" y="465" text-anchor="middle" font-size="15" fill="#60758A">Safe recovery</text><rect x="265" y="680" width="1070" height="75" rx="18" fill="#EAF1F7"/><text x="800" y="725" text-anchor="middle" font-size="21" font-weight="700" fill="#082542">Treat policies like production code: version, review, validate, test, deploy progressively, observe, and roll back.</text></g></svg>