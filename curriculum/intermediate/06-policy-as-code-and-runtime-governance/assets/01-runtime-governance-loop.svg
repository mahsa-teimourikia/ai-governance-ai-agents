<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Runtime Governance Control Loop</text>
<text x="65" y="245" font-size="22" fill="#60758A">Governance moves from deployment-time review to deterministic checks on every consequential action.</text>
<rect x="65" y="360" width="205" height="180" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="167" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#1769C2">PROPOSE</text><text x="167" y="465" text-anchor="middle" font-size="17" fill="#60758A">Agent action</text><line x1="270" y1="450" x2="305" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="315" y="360" width="205" height="180" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="417" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#129B96">NORMALIZE</text><text x="417" y="465" text-anchor="middle" font-size="17" fill="#60758A">Trusted context</text><line x1="520" y1="450" x2="555" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="565" y="360" width="205" height="180" rx="22" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="667" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#805AD5">EVALUATE</text><text x="667" y="465" text-anchor="middle" font-size="17" fill="#60758A">Policy engine</text><line x1="770" y1="450" x2="805" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="815" y="360" width="205" height="180" rx="22" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="917" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">DECIDE</text><text x="917" y="465" text-anchor="middle" font-size="17" fill="#60758A">Allow / Deny / Escalate</text><line x1="1020" y1="450" x2="1055" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1065" y="360" width="205" height="180" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1167" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#2F855A">ENFORCE</text><text x="1167" y="465" text-anchor="middle" font-size="17" fill="#60758A">Gateway / wrapper</text><line x1="1270" y1="450" x2="1305" y2="450" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1315" y="360" width="205" height="180" rx="22" fill="#FFFFFF" stroke="#082542" stroke-width="3"/><text x="1417" y="415" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">OBSERVE</text><text x="1417" y="465" text-anchor="middle" font-size="17" fill="#60758A">Evidence + metrics</text><path d="M1390 590 C1390 760 210 760 210 590" fill="none" stroke="#129B96" stroke-width="4" marker-end="url(#a)"/><text x="800" y="785" text-anchor="middle" font-size="21" font-weight="700" fill="#082542">Policy evidence feeds tests, risk thresholds, rollout decisions, and future policy versions.</text></g></svg>