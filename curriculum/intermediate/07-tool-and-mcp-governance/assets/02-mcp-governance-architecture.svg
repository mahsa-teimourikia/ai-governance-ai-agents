<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Governed MCP Architecture</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Governed MCP Architecture</text>
<text x="65" y="245" font-size="22" fill="#60758A">Centralize identity, authorization, validation, routing, metering, and evidence around MCP traffic.</text>
<rect x="70" y="350" width="230" height="190" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="185" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#1769C2">MCP CLIENT</text><text x="185" y="460" text-anchor="middle" font-size="17" fill="#60758A">Agent / host</text>
<line x1="300" y1="445" x2="405" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="420" y="305" width="390" height="280" rx="25" fill="#082542"/><text x="615" y="365" text-anchor="middle" font-size="23" font-weight="700" fill="#B9571D">MCP GATEWAY</text><text x="615" y="415" text-anchor="middle" font-size="17" fill="#FFFFFF">Authenticate • authorize • route</text><text x="615" y="452" text-anchor="middle" font-size="17" fill="#FFFFFF">validate • rate-limit • log</text><text x="615" y="500" text-anchor="middle" font-size="17" fill="#FFFFFF">Mcp-Method / Mcp-Name aware</text>
<line x1="810" y1="445" x2="915" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="930" y="315" width="300" height="260" rx="24" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="1080" y="375" text-anchor="middle" font-size="22" font-weight="700" fill="#805AD5">MCP SERVER</text><text x="1080" y="425" text-anchor="middle" font-size="17" fill="#60758A">tools/list</text><text x="1080" y="462" text-anchor="middle" font-size="17" fill="#60758A">tools/call</text><text x="1080" y="499" text-anchor="middle" font-size="17" fill="#60758A">resources / extensions</text>
<line x1="1230" y1="445" x2="1330" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="1345" y="350" width="190" height="190" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1440" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#2F855A">BACKEND</text><text x="1440" y="458" text-anchor="middle" font-size="17" fill="#60758A">API / DB</text><text x="1440" y="492" text-anchor="middle" font-size="17" fill="#60758A">SaaS</text>
<rect x="260" y="700" width="1080" height="72" rx="18" fill="#EAF1F7"/><text x="800" y="744" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">The gateway becomes the enterprise control point only when direct server/tool access is blocked.</text></g></svg>