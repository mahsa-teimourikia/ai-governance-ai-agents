<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Tool Governance Contract</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Tool Governance Contract</text>
<text x="65" y="245" font-size="22" fill="#60758A">Every exposed tool needs explicit security, risk, execution, and evidence requirements.</text><rect x="65" y="320" width="455" height="180" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="100" y="378" font-size="21" font-weight="700" fill="#1769C2">IDENTITY</text><text x="100" y="430" font-size="18" fill="#60758A">Which agents/users may call?</text><rect x="570" y="320" width="455" height="180" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="605" y="378" font-size="21" font-weight="700" fill="#129B96">INPUT</text><text x="605" y="430" font-size="18" fill="#60758A">Schema + parameter bounds</text><rect x="1075" y="320" width="455" height="180" rx="22" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="1110" y="378" font-size="21" font-weight="700" fill="#805AD5">AUTHORITY</text><text x="1110" y="430" font-size="18" fill="#60758A">Scope + delegated permissions</text><rect x="65" y="550" width="455" height="180" rx="22" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="100" y="608" font-size="21" font-weight="700" fill="#B9571D">RISK</text><text x="100" y="660" font-size="18" fill="#60758A">Impact + reversibility</text><rect x="570" y="550" width="455" height="180" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="605" y="608" font-size="21" font-weight="700" fill="#2F855A">EXECUTION</text><text x="605" y="660" font-size="18" fill="#60758A">Rate + timeout + idempotency</text><rect x="1075" y="550" width="455" height="180" rx="22" fill="#FFFFFF" stroke="#082542" stroke-width="3"/><text x="1110" y="608" font-size="21" font-weight="700" fill="#082542">EVIDENCE</text><text x="1110" y="660" font-size="18" fill="#60758A">Inputs + decision + result</text><rect x="310" y="785" width="980" height="48" rx="14" fill="#FFF0E7"/><text x="800" y="816" text-anchor="middle" font-size="19" font-weight="700" fill="#B9571D">A tool definition describes capability. A governance contract defines safe authority.</text></g></svg>