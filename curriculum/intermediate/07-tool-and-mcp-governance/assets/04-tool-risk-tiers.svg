<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>Risk-Based Tool Governance</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Risk-Based Tool Governance</text>
<text x="65" y="245" font-size="22" fill="#60758A">Not every MCP tool deserves the same controls. Classify the consequence before granting autonomy.</text><rect x="100" y="315" width="1400" height="92" rx="18" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="140" y="371" font-size="22" font-weight="700" fill="#2F855A">T0</text><text x="255" y="355" font-size="19" font-weight="700" fill="#082542">READ</text><text x="255" y="385" font-size="16" fill="#60758A">Search / retrieve</text><text x="820" y="370" font-size="18" fill="#102A43">Auto</text><text x="1320" y="370" font-size="18" font-weight="700" fill="#2F855A">Low</text><rect x="100" y="433" width="1400" height="92" rx="18" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="140" y="489" font-size="22" font-weight="700" fill="#129B96">T1</text><text x="255" y="473" font-size="19" font-weight="700" fill="#082542">REVERSIBLE WRITE</text><text x="255" y="503" font-size="16" fill="#60758A">Draft / tag / update</text><text x="820" y="488" font-size="18" fill="#102A43">Bounded</text><text x="1320" y="488" font-size="18" font-weight="700" fill="#129B96">Moderate</text><rect x="100" y="551" width="1400" height="92" rx="18" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="140" y="607" font-size="22" font-weight="700" fill="#B9571D">T2</text><text x="255" y="591" font-size="19" font-weight="700" fill="#082542">EXTERNAL EFFECT</text><text x="255" y="621" font-size="16" fill="#60758A">Send / purchase / deploy</text><text x="820" y="606" font-size="18" fill="#102A43">Approval by risk</text><text x="1320" y="606" font-size="18" font-weight="700" fill="#B9571D">High</text><rect x="100" y="669" width="1400" height="92" rx="18" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="140" y="725" font-size="22" font-weight="700" fill="#C53030">T3</text><text x="255" y="709" font-size="19" font-weight="700" fill="#082542">IRREVERSIBLE / CRITICAL</text><text x="255" y="739" font-size="16" fill="#60758A">Payment / delete / privilege</text><text x="820" y="724" font-size="18" fill="#102A43">Multi-party / strict</text><text x="1320" y="724" font-size="18" font-weight="700" fill="#C53030">Critical</text><text x="800" y="835" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Governance burden rises with impact × access × irreversibility × uncertainty.</text></g></svg>