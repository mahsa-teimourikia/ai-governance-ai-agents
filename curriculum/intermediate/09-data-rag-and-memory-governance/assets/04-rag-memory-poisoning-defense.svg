<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>RAG &amp; Memory Poisoning Defense</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">RAG &amp; Memory Poisoning Defense</text><text x="65" y="245" font-size="22" fill="#60758A">Treat retrieved content and remembered observations as data from explicit trust domains.</text>
<rect x="80" y="340" width="270" height="220" rx="22" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="215" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#C53030">UNTRUSTED INPUT</text><text x="215" y="450" text-anchor="middle" font-size="17" fill="#60758A">Document • web</text><text x="215" y="485" text-anchor="middle" font-size="17" fill="#60758A">tool output • user</text>
<line x1="350" y1="450" x2="450" y2="450" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="465" y="300" width="400" height="300" rx="25" fill="#082542"/><text x="665" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#B9571D">TRUST BOUNDARY</text><text x="665" y="410" text-anchor="middle" font-size="17" fill="#FFFFFF">provenance • ACL • scanning</text><text x="665" y="448" text-anchor="middle" font-size="17" fill="#FFFFFF">instruction isolation • validation</text><text x="665" y="486" text-anchor="middle" font-size="17" fill="#FFFFFF">freshness • contradiction checks</text><text x="665" y="530" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">TRUST ≠ RELEVANCE</text>
<line x1="865" y1="450" x2="965" y2="450" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="980" y="340" width="250" height="220" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="1105" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#129B96">CONTEXT</text><text x="1105" y="450" text-anchor="middle" font-size="17" fill="#60758A">Evidence, not</text><text x="1105" y="485" text-anchor="middle" font-size="17" fill="#60758A">authority</text>
<line x1="1230" y1="450" x2="1320" y2="450" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="1335" y="340" width="200" height="220" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1435" y="400" text-anchor="middle" font-size="21" font-weight="700" fill="#2F855A">AGENT</text><text x="1435" y="450" text-anchor="middle" font-size="17" fill="#60758A">Policy remains</text><text x="1435" y="485" text-anchor="middle" font-size="17" fill="#60758A">external</text>
<rect x="255" y="715" width="1090" height="65" rx="17" fill="#FFF0E7"/><text x="800" y="755" text-anchor="middle" font-size="20" font-weight="700" fill="#B9571D">Retrieved text may inform reasoning. It must not silently redefine permissions or policy.</text></g></svg>