<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>Memory Is a Governed Data Store</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#B9571D"/></marker></defs>
<rect width="1600" height="900" fill="#F7F9FC"/><g font-family="Arial,Helvetica,sans-serif">
<text x="65" y="80" font-size="30" font-weight="800" fill="#082542">one<tspan fill="#B9571D">+</tspan>i</text>
<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Memory Is a Governed Data Store</text><text x="65" y="245" font-size="22" fill="#60758A">Persistent memory needs an explicit write policy, lifecycle, and deletion path.</text>
<rect x="75" y="350" width="250" height="190" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="200" y="410" text-anchor="middle" font-size="22" font-weight="700" fill="#1769C2">OBSERVATION</text><text x="200" y="458" text-anchor="middle" font-size="17" fill="#60758A">Conversation / tool</text>
<line x1="325" y1="445" x2="425" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="440" y="305" width="430" height="280" rx="25" fill="#082542"/><text x="655" y="365" text-anchor="middle" font-size="22" font-weight="700" fill="#B9571D">MEMORY WRITE GATE</text><text x="655" y="410" text-anchor="middle" font-size="17" fill="#FFFFFF">Purpose • consent • sensitivity</text><text x="655" y="448" text-anchor="middle" font-size="17" fill="#FFFFFF">provenance • confidence • scope</text><text x="655" y="486" text-anchor="middle" font-size="17" fill="#FFFFFF">retention • validation • authority</text><text x="655" y="530" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">STORE / TEMPORARY / REJECT</text>
<line x1="870" y1="445" x2="970" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="985" y="340" width="260" height="210" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1115" y="400" text-anchor="middle" font-size="22" font-weight="700" fill="#2F855A">MEMORY</text><text x="1115" y="447" text-anchor="middle" font-size="17" fill="#60758A">Scoped • TTL</text><text x="1115" y="482" text-anchor="middle" font-size="17" fill="#60758A">Correctable</text>
<line x1="1245" y1="445" x2="1335" y2="445" stroke="#B9571D" stroke-width="5" marker-end="url(#a)"/>
<rect x="1350" y="350" width="185" height="190" rx="22" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="1442" y="410" text-anchor="middle" font-size="21" font-weight="700" fill="#C53030">EXPIRY</text><text x="1442" y="455" text-anchor="middle" font-size="17" fill="#60758A">Delete</text><text x="1442" y="488" text-anchor="middle" font-size="17" fill="#60758A">Revalidate</text>
<text x="800" y="760" text-anchor="middle" font-size="21" font-weight="700" fill="#082542">Not everything an agent observes deserves to become memory.</text></g></svg>