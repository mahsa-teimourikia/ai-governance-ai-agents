<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">Data, RAG &amp; Memory Control Plane</text><text x="65" y="245" font-size="22" fill="#60758A">Govern the full information lifecycle—not only the model response.</text><rect x="55" y="355" width="210" height="185" rx="22" fill="#FFFFFF" stroke="#1769C2" stroke-width="3"/><text x="160" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#1769C2">SOURCE</text><text x="160" y="463" text-anchor="middle" font-size="17" fill="#60758A">Classify</text><line x1="265" y1="447" x2="300" y2="447" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="310" y="355" width="210" height="185" rx="22" fill="#FFFFFF" stroke="#129B96" stroke-width="3"/><text x="415" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#129B96">INGEST</text><text x="415" y="463" text-anchor="middle" font-size="17" fill="#60758A">Validate</text><line x1="520" y1="447" x2="555" y2="447" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="565" y="355" width="210" height="185" rx="22" fill="#FFFFFF" stroke="#805AD5" stroke-width="3"/><text x="670" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#805AD5">INDEX</text><text x="670" y="463" text-anchor="middle" font-size="17" fill="#60758A">Scope</text><line x1="775" y1="447" x2="810" y2="447" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="820" y="355" width="210" height="185" rx="22" fill="#FFFFFF" stroke="#B9571D" stroke-width="3"/><text x="925" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#B9571D">RETRIEVE</text><text x="925" y="463" text-anchor="middle" font-size="17" fill="#60758A">Authorize</text><line x1="1030" y1="447" x2="1065" y2="447" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1075" y="355" width="210" height="185" rx="22" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/><text x="1180" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#2F855A">CONTEXT</text><text x="1180" y="463" text-anchor="middle" font-size="17" fill="#60758A">Filter</text><line x1="1285" y1="447" x2="1320" y2="447" stroke="#B9571D" stroke-width="4" marker-end="url(#a)"/><rect x="1330" y="355" width="210" height="185" rx="22" fill="#FFFFFF" stroke="#C53030" stroke-width="3"/><text x="1435" y="415" text-anchor="middle" font-size="21" font-weight="700" fill="#C53030">MEMORY</text><text x="1435" y="463" text-anchor="middle" font-size="17" fill="#60758A">Retain</text><rect x="230" y="700" width="1140" height="72" rx="18" fill="#EAF1F7"/><text x="800" y="744" text-anchor="middle" font-size="20" font-weight="700" fill="#082542">Govern data before retrieval, at retrieval, in context, and again before persistence.</text></g></svg>