<text x="65" y="130" font-size="16" font-weight="700" fill="#082542">PRACTICAL <tspan fill="#B9571D">AI.</tspan> REAL <tspan fill="#B9571D">IMPACT.</tspan></text>
<text x="65" y="205" font-size="44" font-weight="700" fill="#082542">RAG Provenance &amp; Access</text><text x="65" y="245" font-size="22" fill="#60758A">Preserve classification, authorization, trust, and lineage from source to generated answer.</text>
