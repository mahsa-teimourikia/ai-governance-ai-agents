[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-ai-agents"
version = "0.1.0"
description = "AI Governance for Agents Curriculum"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy",
  "scikit-learn",
  "networkx",
  "matplotlib",
  "openpyxl",
  "requests",
  "jsonschema",
  "jinja2",
  "PyYAML>=6.0",
  "openai",
  "openai-agents",
  "agent-framework",
  "agent-framework-core",
  "langgraph",
  "mcp",
  "PyJWT",
  "cryptography",
  "openfga_sdk",
  "opa-python-client",
  "sigstore",
  "openai-guardrails",
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp",
  "pytest",
  "cyclonedx-bom"
]

[project.optional-dependencies]
contributor = [
  "pytest",
  "ipykernel"
]
