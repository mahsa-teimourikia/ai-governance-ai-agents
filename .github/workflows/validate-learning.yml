name: Validate learning materials
on:
  push:
    paths:
      - 'curriculum/**/*.ipynb'
      - 'pyproject.toml'
      - 'Makefile'
      - 'tests/**'
      - 'hub/lessons.js'
      - '.github/workflows/validate-learning.yml'
  pull_request:
    paths:
      - 'curriculum/**/*.ipynb'
      - 'pyproject.toml'
      - 'Makefile'
      - 'tests/**'
      - 'hub/lessons.js'
      - '.github/workflows/validate-learning.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: make setup-contributor
      - run: make test
