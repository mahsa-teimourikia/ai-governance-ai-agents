name: Validate learning materials
on:
  push:
    paths:
      - 'curriculum/**'
      - 'README.md'
      - 'COURSE_IMPROVEMENT_PLAN.md'
      - 'course_content.md'
      - 'pyproject.toml'
      - 'Makefile'
      - 'scripts/**'
      - 'tests/**'
      - 'hub/**'
      - '.github/workflows/validate-learning.yml'
  pull_request:
    paths:
      - 'curriculum/**'
      - 'README.md'
      - 'COURSE_IMPROVEMENT_PLAN.md'
      - 'course_content.md'
      - 'pyproject.toml'
      - 'Makefile'
      - 'scripts/**'
      - 'tests/**'
      - 'hub/**'
      - '.github/workflows/validate-learning.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7.0.0
        with: { python-version: '3.12' }
      - run: make setup-contributor
      - run: make validate
